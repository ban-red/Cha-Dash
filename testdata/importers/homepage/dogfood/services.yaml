- Servers:
  # For proxmox
  # 1. Create Group: Datacenter > Permissions > Groups > Create (e.g., api-ro-users).
  # 2. Group Permission: Permissions > Add > Group Permission (Path: /, Group: api-ro-users, Role: PVEAuditor, Propagate: Checked).
  # 3. Create User: Permissions > Users > Add (e.g., api, Realm: Linux PAM, Group: api-ro-users).
  # 4. Create API Token: Permissions > API Tokens > Add (User: api, Token ID: e.g., homepage, Privilege Separation: Checked).
  # 5. API Token Permission: Permissions > Add > API Token Permission (Path: /, API Token: homepage, Role: PVEAuditor, Propagate: Checked).
  # 6. Use api@pam!homepage as username and "Secret" as password.
  - OPNSense:
      href: https://opnsense.lab.example
      icon: opnsense.png
      widget:
        type: opnsense
        url: http://10.0.11.1
